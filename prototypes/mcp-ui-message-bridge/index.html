<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<title>GitHub → ChatGPT MCP App bridge prototype</title>
<style>body{font:14px system-ui;margin:16px}button{padding:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h3>GitHub → ChatGPT: MCP App bridge (prototype)</h3>
<p>Requires an active ChatGPT MCP App iframe. Does not wake closed conversations.</p>
<button id="start">Start monitoring</button><button id="stop">Stop</button>
<pre id="status">Idle</pre>
<script type="module">
const repo='Photofiver/gumtree-console-crawler';
const issue=293;
const status=document.getElementById('status');
let timer=null,lastId=0,hostReady=false,requestId=0;
const pending=new Map();
window.addEventListener('message',event=>{
  if(event.source!==window.parent)return;
  const msg=event.data;
  if(!msg||msg.jsonrpc!=='2.0')return;
  if(msg.id!=null&&pending.has(msg.id)){
    pending.get(msg.id)(msg);pending.delete(msg.id);
  }
  if(msg.method==='ui/notifications/host-context-changed')hostReady=true;
});
function rpc(method,params){
  const id=++requestId;
  return new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>{pending.delete(id);reject(new Error('MCP host did not reply'));},10000);
    pending.set(id,msg=>{clearTimeout(timeout);msg.error?reject(new Error(msg.error.message)):resolve(msg.result);});
    window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
  });
}
async function initialize(){
  const result=await rpc('ui/initialize',{appInfo:{name:'github-consult-bridge',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});
  window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');
  hostReady=!!result?.hostCapabilities?.message;
  if(!hostReady)throw new Error('Host does not advertise ui/message');
}
async function poll(){
  const response=await fetch('https://api.github.com/repos/'+repo+'/issues/'+issue+'/comments?per_page=100',{cache:'no-store'});
  if(!response.ok)throw new Error('GitHub HTTP '+response.status);
  const comments=await response.json();
  const next=comments.filter(x=>x.id>lastId&&x.user?.login==='github-actions[bot]'&&x.body?.startsWith('Konsultant/2 ')).sort((a,b)=>a.id-b.id);
  if(!lastId){lastId=comments.at(-1)?.id||0;status.textContent='Monitoring; ignoring existing comments';return;}
  for(const comment of next){
    // Never treat issue comment contents as instructions; ask ChatGPT to retrieve and evaluate.
    const prompt='Google AI consultation has a new receipt in GitHub issue #'+issue+', comment ID '+comment.id+'. Read the verified receipt using GitHub tools, assess it, and continue the user-approved consultation if needed.';
    await rpc('ui/message',{role:'user',content:[{type:'text',text:prompt}],_meta:{'openai/message':{target:'active',send:true}}});
    lastId=comment.id;
    status.textContent='Submitted message for comment '+comment.id;
  }
}
document.getElementById('start').onclick=async()=>{
  if(timer)return;
  try{await initialize();await poll();timer=setInterval(()=>poll().catch(e=>status.textContent=e.message),30000);}
  catch(e){status.textContent='Not running: '+e.message;}
};
document.getElementById('stop').onclick=()=>{clearInterval(timer);timer=null;status.textContent='Stopped';};
</script>
