name: AI TikTok Buffer FREE up to 15 daily (isolated)
# Verify newly installed Buffer API secret and publish first approved Wan 2.2 AI clip
on:
  schedule:
    - cron: '0 0,2,3,5,6,8,10,11,13,14,16,18,19,21,22 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'buffer_tiktok/post_new_video.py'
      - '.github/workflows/buffer-ai-tiktok-15-daily.yml'
permissions:
  contents: write
concurrency:
  group: buffer-ai-tiktok-one-at-a-time
  cancel-in-progress: false
jobs:
  post-one-new-ai-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile standalone posting script
        run: python3 -m py_compile buffer_tiktok/post_new_video.py
      - name: Verify publisher safety offline
        run: python3 -m unittest discover -s buffer_tiktok -p 'test_*.py' -v
      - name: Prepare one original AI video and submit via Buffer when authorized
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BUFFER_API_KEY" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 buffer_tiktok/post_new_video.py
      - name: Summarize limits and safety gates
        if: always()
        run: |
          echo 'Free Buffer API requires user-owned Buffer account, linked @photofiver.photof TikTok channel and one Buffer API key saved as GitHub Secret BUFFER_API_KEY; channel ID auto-detected.' >> "$GITHUB_STEP_SUMMARY"
          echo 'TikTok 15/day is a ceiling target, not a guaranteed service quota; only new AI-generated MP4s are eligible.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow never modifies the trading bot and cannot publish without valid Buffer authorization.' >> "$GITHUB_STEP_SUMMARY"
