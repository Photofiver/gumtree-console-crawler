name: Publish original AI film WITH sound as MP4
on:
  push:
    paths:
      - '.github/workflows/publish-original-ai-film-with-sound.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve verified original AI film with sound
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p social_videos /tmp/sound-video
          gh run download 43792053442 --repo ${{ github.repository }} --name verified-ai-film-with-sound --dir /tmp/sound-video
          test -s /tmp/sound-video/generated-ai-film-with-sound.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/sound-video/sound_video_report.json').read_text())
          assert d['success'] and d['original_ai_audio'] and d['generated_from_text']
          assert d['mean_audio_db'] > -60
          print('Confirmed original AI visual + actual generated audio:', d['mean_audio_db'], 'dB')
          PY
          cp /tmp/sound-video/generated-ai-film-with-sound.mp4 social_videos/original-ai-film-with-sound.mp4
      - name: Publish directly downloadable MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social_videos/original-ai-film-with-sound.mp4
          if git diff --cached --quiet; then echo "Already published"; exit 0; fi
          git commit -m "Publish generated AI film with model-produced sound"
          git push origin HEAD:main
