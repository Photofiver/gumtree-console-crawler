name: Render silent coffee cat locally and verify TikTok account
on:
  push:
    paths:
      - 'cat_short/render_coffee_cat_offline.py'
      - '.github/workflows/render-coffee-cat-offline.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coffee-cat-offline
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline animation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pillow
      - name: Render original animated coffee-drinking cat MP4
        run: python3 cat_short/render_coffee_cat_offline.py
      - name: Verify moving vertical video with no audio stream
        run: |
          python3 - <<'PY'
          import json,subprocess
          p="social_videos/cat-drinking-coffee-silent.mp4"
          q=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",p]))
          assert len(q["streams"])==1 and q["streams"][0]["codec_type"]=="video"
          assert q["streams"][0]["height"]>q["streams"][0]["width"]
          assert float(q["format"]["duration"])>=6
          assert int(q["format"]["size"])>50000
          print("VERIFIED CAT COFFEE VIDEO",q["format"]["duration"],q["format"]["size"])
          PY
      - name: Save verified video to GitHub without touching other projects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social_videos/cat-drinking-coffee-silent.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Render original mute coffee-drinking cat animation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Test direct TikTok creator authorization without a third party
        if: always()
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OAUTH_ACCESS_TOKEN: ${{ secrets.TIKTOK_OAUTH_ACCESS_TOKEN }}
          TIKTOK_API_ACCESS_TOKEN: ${{ secrets.TIKTOK_API_ACCESS_TOKEN }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
        run: python3 autopost_tiktok/direct_preflight.py
      - name: Preserve video and truthful TikTok permission result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-coffee-cat-video-and-tiktok-permission
          path: |
            social_videos/cat-drinking-coffee-silent.mp4
            autopost_tiktok/preflight-status.json
          if-no-files-found: warn
          retention-days: 14
