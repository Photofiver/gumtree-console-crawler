name: Google AI consultation continuity controller
on:
  push:
    branches: [main]
    paths: ['.github/workflows/google-ai-consult-continuity.yml']
  # The cold Google AI review finished (success or failure).
  workflow_run:
    workflows: ["Google AI Mode ask (isolated)"]
    types: [completed]
  # The warm worker dispatches this as soon as its Google AI result is posted.
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to check immediately (optional)"
        required: false
        type: string

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: google-ai-consult-continuity
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'push'
    outputs:
      bridge_issue: ${{ steps.receipt.outputs.bridge_issue }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Recover failed consultations and preserve unfinished work
        id: receipt
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const {describeUnresolvedReceipt} = require(process.env.GITHUB_WORKSPACE + '/phone_google_ask/google_ai_receipt_guard.js');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- google-ai-continuity-controller-v1 -->';
            const workflow_id = 'google-ai-ask.yml';
            const eventRun = context.payload.workflow_run;
            const matchedRun = /Google AI issue #([0-9]+)/.exec(eventRun?.display_title || '');
            const targetNumber = Number(
              context.payload.inputs?.issue_number || matchedRun?.[1] || 0
            );
            if (eventRun && eventRun.event !== 'issues') {
              core.info('Ignoring non-issue workflow completion.');
              return;
            }

            // Inspect the newest open consultations, without reposting a draft
            // or treating an unresolved Google AI verdict as completed work.
            const issuePages = [];
            if (targetNumber) {
              const response = await github.rest.issues.get({
                owner, repo, issue_number: targetNumber
              });
              issuePages.push(response.data);
            } else {
              for (let page = 1; page <= 3; page++) {
                const response = await github.rest.issues.listForRepo({
                  owner, repo, state: 'open', sort: 'updated', direction: 'desc',
                  per_page: 100, page
                });
                issuePages.push(...response.data);
                if (response.data.length < 100) break;
              }
            }
            const issues = issuePages.filter(i =>
              !i.pull_request && i.title.startsWith('[consult]') &&
              i.user?.login === owner &&
              (!targetNumber || i.number === targetNumber)).slice(0, 60);

            const runs = [];
            if (eventRun) {
              runs.push(eventRun);
            } else {
              for (let page = 1; page <= 5; page++) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id, event: 'issues', per_page: 100, page
                });
                runs.push(...response.data.workflow_runs);
                if (response.data.workflow_runs.length < 100) break;
              }
            }

            for (const issue of issues) {
              try {
                const run = runs.find(r =>
                  r.display_title === 'Google AI issue #' + issue.number);
                if (!run) {
                  core.warning('Consultation #' + issue.number +
                    ' has no visible workflow run; an issue-triggered run must be investigated.');
                  continue;
                }
                // A warm Google AI receipt can arrive before the cold worker finishes.
                // Read it immediately rather than waiting for the cold workflow.
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  {owner, repo, issue_number: issue.number, per_page: 100}
                );
                const digest = crypto.createHash('sha256')
                  .update(issue.body || '', 'utf8').digest('hex');
                const receipts = comments.filter(c =>
                  c.user?.login === 'github-actions[bot]' &&
                  (c.body || '').startsWith('Konsultant/2 ')
                ).reverse();
                let receipt = null;
                for (const comment of receipts) {
                  try {
                    const parsed = JSON.parse(comment.body.substring('Konsultant/2 '.length));
                    if (parsed.issue === issue.number && parsed.sha256 === digest &&
                        (parsed.run === undefined || parsed.run === run.id)) {
                      receipt = parsed;
                      break;
                    }
                  } catch (err) {
                    core.warning('Unreadable receipt for #' + issue.number);
                  }
                }
                if (targetNumber && receipt?.google_ai_responses_received > 0) {
                  core.setOutput('bridge_issue', String(issue.number));
                }
                if (receipt?.status === 'POTWIERDZONE' &&
                    receipt.review === 'SPRAWDZONE' &&
                    receipt.google_ai_responses_received > 0) {
                  core.info('Consultation #' + issue.number + ' verified; no action.');
                  continue;
                }

                if (run.status !== 'completed' && !receipt) {
                  core.info('Consultation #' + issue.number +
                    ' pending, with no authenticated warm receipt yet.');
                  continue;
                }
                const transportMissing = !receipt ||
                  (receipt.google_ai_responses_received || 0) === 0;
                // A successful GitHub job is not proof that Google AI answered.
                // Retry missing or zero-response receipts, regardless of job conclusion.
                const shouldRetry = transportMissing;
                if (shouldRetry && run.status === 'completed' && (run.run_attempt || 1) < 3) {
                  await github.rest.actions.reRunWorkflow({
                    owner, repo, run_id: run.id
                  });
                  core.info('Re-ran transport for #' + issue.number +
                    ' (next attempt ' + ((run.run_attempt || 1) + 1) + '/3).');
                  continue;
                }

                // No ChatGPT session can be reawakened by a GitHub comment.
                // Keep an explicit, idempotent evidence trail for the next turn.
                if (comments.some(c => (c.body || '').includes(marker))) {
                  continue;
                }
                const status = receipt?.status || 'NIEPOTWIERDZONE';
                const review = receipt?.review || 'BRAK WERYFIKACJI';
                const reason = describeUnresolvedReceipt(receipt).slice(0, 1600);
                const body = [
                  marker,
                  '**Kontroler ciągłości: zadanie nie jest potwierdzone.**',
                  'Status: ' + status + '; ocena Google AI: ' + review + '.',
                  'Powód: ' + reason,
                  'Kolejna akcja: ChatGPT musi sprawdzić źródła, poprawić szkic i utworzyć',
                  'nowe [consult] z parent_issue=' + issue.number + ', zachowując wszystkie wymagania.',
                  'Kontroler automatycznie ponawia jedynie nieudany transport/audyt.',
                  'GitHub nie może sam wznowić zamkniętej odpowiedzi ChatGPT ani',
                  'wygenerować za nią zweryfikowanego rozwiązania.'
                ].join('\n');
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number, body
                });
                core.info('Recorded unresolved consultation #' + issue.number);
              } catch (err) {
                core.warning('Continuity check failed for #' + issue.number +
                  ': ' + String(err.message || err).slice(0, 300));
              }
            }

  ordinary-chat:
    needs: monitor
    if: >-
      always() && !cancelled() &&
      ((needs.monitor.result == 'success' && needs.monitor.outputs.bridge_issue != '') ||
       (github.event_name == 'push' && github.event.head_commit.message == 'Run ordinary chat bridge for consultation 293 with diagnostics'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      ROOT_ISSUE: ${{ needs.monitor.outputs.bridge_issue || '293' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned chatgpt-web client
        run: |
          git clone --quiet https://github.com/tritao/chatgpt-web.git "$RUNNER_TEMP/chatgpt-web"
          git -C "$RUNNER_TEMP/chatgpt-web" checkout --quiet 0024d5a7d1a4cb2005cada92c8c6ee983c2cb9c3
          python3 -m venv "$RUNNER_TEMP/chat-python"
          "$RUNNER_TEMP/chat-python/bin/pip" install -q -r "$RUNNER_TEMP/chatgpt-web/requirements.txt"
          echo "$RUNNER_TEMP/chat-python/bin" >> "$GITHUB_PATH"
      - name: Start ordinary chat bridge
        id: bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 plugins/google-ai-konsultant/local_chat_continuity.py --once --root-issue "$ROOT_ISSUE" --chatgpt-web "$RUNNER_TEMP/chatgpt-web/chatgpt-web"
      - name: Diagnose browser connection after a failed start
        if: failure() && steps.bridge.outcome == 'failure'
        run: |
          if curl --silent --fail --max-time 3 --output /dev/null http://127.0.0.1:9222/json/version; then
            echo "Chrome debugging endpoint reachable on port 9222"
          else
            echo "Chrome debugging endpoint unavailable on port 9222"
          fi
          "$RUNNER_TEMP/chatgpt-web/chatgpt-web" status > "$RUNNER_TEMP/ordinary-status.log" 2>&1 || true
          if grep -Fq "daemon failed to start" "$RUNNER_TEMP/ordinary-status.log"; then
            echo "chatgpt-web reports that its daemon failed to start"
          fi
