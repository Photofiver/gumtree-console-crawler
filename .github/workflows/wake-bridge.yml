name: Wake Bridge
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue: {required: true, type: string}
      comment: {required: true, type: string}
  push:
    branches: [main]
    paths: ['.github/workflows/wake-bridge.yml']

permissions:
  issues: write

jobs:
  wake:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'Install wake bridge and verify receipt on issue 293') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'github-actions[bot]') &&
       (startsWith(github.event.comment.body, 'Konsultant/2 ') || startsWith(github.event.comment.body, 'BudzGoogle/1 ')))
    runs-on: ubuntu-latest
    concurrency:
      group: wake-${{ github.event.comment.id || inputs.comment || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const p = context.payload;
            const issue_number = Number(p.issue?.number || p.inputs?.issue || 293);
            const args = {owner, repo, issue_number};
            const {data: issue} = await github.rest.issues.get(args);
            if (issue.pull_request || issue.user.login !== owner || !issue.title.startsWith('[consult]')) return;
            const comments = await github.paginate(github.rest.issues.listComments, {...args, per_page: 100});
            const hash = require('crypto').createHash('sha256').update(issue.body || '').digest('hex');
            function classify(c) {
              if (c.user.login === 'github-actions[bot]' && c.body.startsWith('Konsultant/2 ')) {
                let r;
                try { r = JSON.parse(c.body.slice('Konsultant/2 '.length)); } catch { return; }
                if (r.issue === issue_number && r.sha256 === hash && r.google_ai_responses_received > 0) return 'chatgpt';
              }
              if ([owner, 'github-actions[bot]'].includes(c.user.login) && c.body.startsWith('BudzGoogle/1 ')) return 'google';
            }
            const commentId = p.comment?.id || Number(p.inputs?.comment);
            const source = commentId ? comments.find(c => c.id === commentId) :
              comments.slice().reverse().find(c => classify(c) === 'chatgpt');
            const side = source && classify(source);
            if (!side) {
              if (context.eventName !== 'issue_comment') core.setFailed('No matching source comment');
              return;
            }
            const marker = '<!-- wake:' + side + ':' + source.id + ' -->';
            if (comments.some(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker))) return;
            const label = side === 'chatgpt' ? 'ChatGPT' : 'Google AI';
            const {data} = await github.rest.issues.createComment({...args, body:
              'Sygnał dla ' + label + ' po [komentarzu źródłowym](' + source.html_url + ').\n\n' + marker});
            core.info(data.html_url);
