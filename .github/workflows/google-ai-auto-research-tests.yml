name: ChatGPT Google AI transport regression tests
on:
  push:
    paths:
      - phone_google_ask/auto_research.py
      - phone_google_ask/test_auto_research.py
      - phone_google_ask/test_warm_worker.py
      - phone_google_ask/test_consult.py
      - .github/workflows/google-ai-auto-research-tests.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run resumability tests
        id: regression
        run: |
          python3 -m py_compile phone_google_ask/auto_research.py phone_google_ask/warm_worker.py
          python3 -m unittest discover -s phone_google_ask -p test_auto_research.py -v
          python3 -m unittest discover -s phone_google_ask -p test_warm_worker.py -v
          python3 -m unittest discover -s phone_google_ask -p test_consult.py -v
      - name: Publish regression result to coordinator issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const {data: issue} = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 277
            });
            if (!issue.title.startsWith('[auto-research]')) return;
            const status = '${{ steps.regression.outcome }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: 277,
              body: 'Transport regression: ' + status + '\n' + context.serverUrl +
                '/' + context.repo.owner + '/' + context.repo.repo +
                '/actions/runs/' + context.runId
            });
