name: Audit 20 search engines on Android

on:
  push:
    paths:
      - 'android_browser/**'
      - '.github/workflows/phone-browser-search-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile phone browser and test APKs
        run: gradle --no-daemon -p android_browser :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Search the web from Android WebView, sequentially
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android_browser/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android_browser/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.photofiver.phonebrowser.SequentialSearchAuditTest com.photofiver.phonebrowser.test/androidx.test.runner.AndroidJUnitRunner | tee search-audit-instrumentation.txt
            adb logcat -d -s PHONE_SEARCH_AUDIT:I '*:S' > search-audit-logcat.txt || true
            adb pull /sdcard/Android/data/com.photofiver.phonebrowser/files/search-audit.json search-audit.json
            test -s search-audit.json
      - name: Publish all 20 search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-20-search-engines-report
          path: |
            search-audit.json
            search-audit-instrumentation.txt
            search-audit-logcat.txt
          if-no-files-found: warn
          retention-days: 14
