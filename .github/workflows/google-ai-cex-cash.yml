name: Google AI CeX HDD cash lookup
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  ai-mode:
    if: ${{ startsWith(github.event.issue.title, '[google-cex]') && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build one isolated AI Mode test
        run: |
          cp phone_cex_probe/CexCashTest.java android_browser/app/src/androidTest/java/com/photofiver/phonebrowser/CexCashTest.java
          gradle --no-daemon -p android_browser :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ask Google AI Mode one public question
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android_browser/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android_browser/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout -k 5s 125s adb shell am instrument -w -r -e class com.photofiver.phonebrowser.CexCashTest com.photofiver.phonebrowser.test/androidx.test.runner.AndroidJUnitRunner | tee google-ai-instrumentation.txt
            grep -q 'OK (1 test)' google-ai-instrumentation.txt
            adb pull /sdcard/Android/data/com.photofiver.phonebrowser/files/google-ai-cex-price.json google-ai-cex-price.json
            cat google-ai-cex-price.json
      - name: Upload Google AI Mode result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-ai-cex-price-result
          path: |
            google-ai-cex-price.json
            google-ai-instrumentation.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Google's actual answer into issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Google AI Mode did not produce a readable answer. See run logs and artifact.';
            if (fs.existsSync('google-ai-cex-price.json')) {
              const result=JSON.parse(fs.readFileSync('google-ai-cex-price.json','utf8'));
              const p=result.page || {};
              body='Google AI Mode CeX UK HDD query (unverified response, check primary source):\n\n' + 
                'PAGE: ' + (p.url||result.loadUrl) + '\n' +
                'QUESTION: '+result.question+'\n\n'+
                'PAGE TITLE: '+(p.title||'')+'\n\n' +
                'TEXT:\n'+(p.text||'NO TEXT')+'\n\n' +
                'SOURCE LINKS: '+JSON.stringify(p.sourceLinks||[]);
            }
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:body.slice(0,58000)});
