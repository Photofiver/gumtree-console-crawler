name: Publish AI speaking robot with natural Polish voice
on:
  push:
    paths:
      - '.github/workflows/publish-ai-robot-natural-polish-voice.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download checked Piper neural voice film
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p social_videos /tmp/naturalvoice
          gh run download 43793293758 --repo ${{ github.repository }} --name original-ai-film-neural-polish-voice --dir /tmp/naturalvoice
          test -s /tmp/naturalvoice/ai-robot-neural-human-voice-pl.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/naturalvoice/neural-voice-report.json').read_text())
          assert report['success'] is True
          assert report['voice_model']=='pl_PL-gosia-medium'
          assert set(s['codec_type'] for s in report['streams'])=={'video','audio'}
          PY
          cp /tmp/naturalvoice/ai-robot-neural-human-voice-pl.mp4 social_videos/ai-robot-natural-human-polish-voice.mp4
      - name: Commit directly downloadable MP4
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social_videos/ai-robot-natural-human-polish-voice.mp4
          if git diff --cached --quiet; then echo "Already published"; exit 0; fi
          git commit -m "Publish original AI robot film with Polish neural voice"
          git push origin HEAD:main
