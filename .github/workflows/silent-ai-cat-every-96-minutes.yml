name: AI cat reach recovery (up to 3 longer originals per day)
on:
  schedule:
    # Temporary zero-view recovery: three evenly spaced publishing windows.
    # Retry each window once in case GitHub skips a scheduled event.
    # Generator still creates at most one fresh, unique 3-shot story per slot.
    - cron: '1,17 0,8,16 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/silent-ai-cat-every-96-minutes.yml'
      - 'buffer_tiktok/generate_silent_ai_cat.py'
      - 'buffer_tiktok/test_generate_silent_ai_cat.py'
      - 'buffer_tiktok/post_new_video.py'
      - 'buffer_tiktok/test_post_new_video.py'
permissions:
  contents: write
concurrency:
  group: buffer-ai-tiktok-one-at-a-time
  cancel-in-progress: false
jobs:
  generate-then-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync latest generated clips and publication receipts before this slot
        run: git pull --ff-only origin main
      - name: Install free AI video generator and video tools
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade gradio_client
          # GitHub Ubuntu runners normally include FFmpeg; avoid a slow apt update
          # during every scheduled slot. Install only if either binary is missing.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Test silent video, equal slots, and safe English publisher
        run: |
          python3 -m py_compile buffer_tiktok/generate_silent_ai_cat.py buffer_tiktok/post_new_video.py buffer_tiktok/captions.py
          python3 -m unittest discover -s buffer_tiktok -p 'test_*.py' -v
      - name: Generate new photorealistic AI cat performing a human action (silent, no titles)
        id: create
        continue-on-error: true
        shell: bash
        run: python3 -u buffer_tiktok/generate_silent_ai_cat.py
      - name: Save only validated newly generated original AI media and metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(social_videos/new-ai-cat-*.mp4 social_videos/new-ai-cat-*.json social_videos/story-parts/*/shot??.mp4)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "NO_NEW_AI_CLIP: no verified original video this slot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "All videos already saved"
            exit 0
          fi
          git commit -m "One original silent cat AI TikTok slot with English description"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=true; break; fi
            git pull --rebase origin main
          done
          test "$pushed" = true
      - name: Submit ONE unpublished AI cat clip to approved TikTok through Buffer
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 -u buffer_tiktok/post_new_video.py
      - name: Show verified result and daily free-tier limitations
        if: always()
        env:
          GENERATION_OUTCOME: ${{ steps.create.outcome }}
        run: |
          if [ "$GENERATION_OUTCOME" != "success" ]; then
            echo 'No AI video generated in this slot. Quota or model unavailability. Old media never reused.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'RECOVERY: maximum 3 original 8+ second cat stories/day; no old 3-second clips. This does not guarantee TikTok distribution.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No audio; no added text or subtitles inside the video. English caption and hashtags outside.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual production depends on public free GPU quotas and TikTok/Buffer platform limits.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Trading bot is not touched.' >> "$GITHUB_STEP_SUMMARY"
      - name: Surface failed AI generation as a real workflow failure
        if: ${{ always() && steps.create.outcome == 'failure' }}
        run: |
          echo 'Generation failed after all free providers; no new TikTok video was created.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
