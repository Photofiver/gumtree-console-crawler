name: Google AI Chrome speed test (isolated)
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  chrome-probe:
    if: ${{ startsWith(github.event.issue.title, '[chrome-test]') && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium in isolated venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q selenium
      - name: Query Google AI via installed Chrome
        env:
          CHROME_TEST_QUESTION: ${{ github.event.issue.body }}
        run: .venv/bin/python phone_google_ask/chrome_probe.py
      - name: Post result to issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Chrome test: No result file (failed before probe finished). Check Actions logs.';
            if (fs.existsSync('chrome-ai-test-result.json')) {
              const r = JSON.parse(fs.readFileSync('chrome-ai-test-result.json', 'utf8'));
              body = 'Chrome test: ' + r.status + '\n\nElapsed browser time: ' + r.elapsed_seconds + ' s\nAI ready: ' + r.ready + '\nPage title: ' + (r.page_title || 'none') + '\nText size: ' + (r.text_length || 0) + '\nError: ' + (r.error || 'none') + '\n\nLast page text (excerpt):\n' + (r.preview || '').slice(-1900);
            }
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: body.slice(0,4500)});
