name: Google AI Mode ask (isolated)
run-name: "Google AI issue #${{ github.event.issue.number }}"
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  ask:
    if: ${{ (startsWith(github.event.issue.title, '[google-ask]') || startsWith(github.event.issue.title, '[consult]')) && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prefer already running Google AI warm worker
        id: warm
        uses: actions/github-script@v7
        with:
          script: |
            const {hasAuthenticatedGoogleAnswer} = require(process.env.GITHUB_WORKSPACE + '/phone_google_ask/google_ai_receipt_guard.js');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'google-ai-warm-watchdog.yml', status: 'in_progress', per_page: 20
            });
            const warm = data.workflow_runs.some(r =>
              r.event === 'schedule' || r.event === 'workflow_dispatch' ||
              (r.event === 'issues' && r.display_title?.startsWith('[google-warm-start]'))
            );
            if (!warm) {
              core.setOutput('served', 'false');
              return;
            }
            const until = Date.now() + (context.payload.issue.title.startsWith('[consult]') ? 720000 : 180000);
            while (Date.now() < until) {
              const {data: comments} = await github.rest.issues.listComments({
                owner, repo, issue_number: context.issue.number, per_page: 100
              });
              if (hasAuthenticatedGoogleAnswer(comments, context.payload.issue)) {
                core.setOutput('served', 'true');
                core.info('Authenticated Google AI review received; skipped cold Android startup.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 6500));
            }
            core.setOutput('served', 'false');
      - name: Regression checks for consultation and idea exploration
        if: ${{ startsWith(github.event.issue.title, '[consult]') && steps.warm.outputs.served != 'true' }}
        run: |
          python3 -m unittest discover -s phone_google_ask -p test_consult.py -v
          python3 -m unittest discover -s phone_google_ask -p test_explore.py -v
          python3 -m unittest discover -s phone_google_ask -p test_attention_guard.py -v
      - name: Load trained transformer and calculate actual attention weights
        if: ${{ startsWith(github.event.issue.title, '[consult]') && steps.warm.outputs.served != 'true' }}
        shell: bash
        run: |
          if python3 -m pip install --user --disable-pip-version-check 'sentence-transformers==4.1.0'; then
            python3 phone_google_ask/attention_guard.py
          else
            echo '{"status":"unavailable","reason":"dependency_install_failed"}' > attention-report.json
          fi
      - name: Screen 100 or 1000 source-listed configurations before AI review
        if: ${{ startsWith(github.event.issue.title, '[consult]') && steps.warm.outputs.served != 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from phone_google_ask.explore import screen
          try:
              data = json.loads(json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["issue"]["body"])
              if data.get("idea_target") in (100, 1000):
                  report = screen(data, data["idea_target"])
                  Path("exploration-report.json").write_text(json.dumps(report, ensure_ascii=False))
                  print(json.dumps(report["summary"], ensure_ascii=False))
              else:
                  print("No idea_target: standard review; no artificial idea count.")
          except (ValueError, KeyError, TypeError) as error:
              Path("exploration-error.txt").write_text(str(error))
              print("Exploration unavailable:", error)
          PY
      - name: Prepare question and isolated test
        if: steps.warm.outputs.served != 'true'
        shell: bash
        run: |
          cp phone_google_ask/GoogleAskTest.java android_browser/app/src/androidTest/java/com/photofiver/phonebrowser/GoogleAskTest.java
          if jq -e '.issue.title | startswith("[consult]")' "$GITHUB_EVENT_PATH" >/dev/null; then exit 0; fi
          if jq -e '.issue.title | startswith("[google-ask] [review]")' "$GITHUB_EVENT_PATH" >/dev/null; then
            python3 phone_google_ask/review.py prepare
            exit 0
          fi
          QUESTION_B64="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" | head -c 2000 | base64 -w0)"
          test -n "$QUESTION_B64"
          echo "QUESTION_B64=$QUESTION_B64" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: steps.warm.outputs.served != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: steps.warm.outputs.served != 'true'
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.warm.outputs.served != 'true'
        with:
          gradle-version: '8.13'
      - name: Build test
        if: steps.warm.outputs.served != 'true'
        run: gradle --no-daemon -p android_browser :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        if: steps.warm.outputs.served != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ask Google AI Mode via Android WebView
        if: steps.warm.outputs.served != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android_browser/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android_browser/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            if jq -e '.issue.title | startswith("[consult]")' "$GITHUB_EVENT_PATH" >/dev/null; then python3 phone_google_ask/consult.py; else bash phone_google_ask/cold_ask.sh; fi
      - name: Upload Google AI answer
        if: always() && steps.warm.outputs.served != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: google-ai-ask-result
          path: |
            google-ai-ask-result.json
            consult-result.json
            attention-report.json
            exploration-report.json
            exploration-error.txt
            google-ai-ask-instrumentation.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Post Google AI result to issue
        if: always() && steps.warm.outputs.served != 'true'
        env:
          REVIEW_RUN_OK: ${{ job.status }}
        uses: actions/github-script@v7
        with:
          script: |
            if(context.payload.issue.title.startsWith('[consult]')) {
              const fs = require('fs');
              const crypto = require('crypto');
              const issue = context.payload.issue;
              const fallback = {issue:issue.number,sha256:crypto.createHash('sha256').update(issue.body).digest('hex'),
                review:'NIEPOTWIERDZONE',status:'NIEPOTWIERDZONE',reason:'Workflow failed before receiving Google AI result'};
              const result = fs.existsSync('consult-result.json') ? JSON.parse(fs.readFileSync('consult-result.json','utf8')) : fallback;
              let receipt = {...result,run:context.runId};
              if (Buffer.byteLength(JSON.stringify(receipt),'utf8') > 57000) {
                receipt = {issue:result.issue,sha256:result.sha256,run:context.runId,review:result.review,
                  status:'NIEPOTWIERDZONE',reason:'Full review exceeds comment limit. Read artifact google-ai-ask-result/consult-result.json.'};
              }
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,
                body:'Konsultant/2 '+JSON.stringify(receipt)});
              return;
            }
            const existing = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100});
            if(existing.data.some(c => c.user?.login === 'github-actions[bot]' && (c.body?.startsWith('Google AI: SPRAWDZONE') || c.body?.startsWith('Google AI: DO POPRAWY') || (c.body?.startsWith('Google AI Mode answer') && /AI RESPONSE READY: (True|true)/.test(c.body))))) {
              core.info('Already answered by warm Android session; do not post duplicate result.');
              return;
            }
            const fs=require('fs');
            let body='Google AI Mode did not return a readable result. See the workflow logs.';
            if(fs.existsSync('review-transport-error.txt')){
              body='Google AI: NIE SPRAWDZONO — zapytanie nie zostało wysłane. '+fs.readFileSync('review-transport-error.txt','utf8');
            }
            if(fs.existsSync('review-research-error.txt')){
              body='Kontrola poszukiwań: WYMAGA DALSZEGO SZUKANIA — '+fs.readFileSync('review-research-error.txt','utf8')+' Google AI nie zostało jeszcze zapytane.';
            }
            if(context.payload.issue.title.startsWith('[google-ask] [review]')){
              if(!fs.existsSync('review-transport-error.txt') && !fs.existsSync('review-research-error.txt')) body='Google AI: NIEPOTWIERDZONE';
              if(process.env.REVIEW_RUN_OK === 'success'){
                const {execFileSync}=require('node:child_process');
                body='Google AI: '+execFileSync('python3',['phone_google_ask/review.py','result'],{encoding:'utf8'}).slice(0,-1);
              }
            } else if(fs.existsSync('google-ai-ask-result.json')){
              const result=JSON.parse(fs.readFileSync('google-ai-ask-result.json','utf8'));
              const p=result.page||{};
              body='Google AI Mode answer (unverified, may contain mistakes):\n\nQUESTION: '+result.question+
                '\n\nPAGE: '+(p.url||result.loadUrl)+
                '\n\nTEXT:\n'+(p.text||'NO TEXT')+
                '\n\nSOURCE LINKS: '+JSON.stringify(p.sourceLinks||[])+
                '\n\nAI RESPONSE READY: '+Boolean(result.aiResponseReady);
            }
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:body.slice(0,58000)});
