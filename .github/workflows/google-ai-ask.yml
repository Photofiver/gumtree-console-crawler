name: Google AI Mode ask (isolated)
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  ask:
    if: ${{ startsWith(github.event.issue.title, '[google-ask]') && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare question and isolated test
        shell: bash
        run: |
          cp phone_google_ask/GoogleAskTest.java android_browser/app/src/androidTest/java/com/photofiver/phonebrowser/GoogleAskTest.java
          if jq -e '.issue.title | startswith("[google-ask] [review]")' "$GITHUB_EVENT_PATH" >/dev/null; then
            python3 phone_google_ask/review.py prepare
            exit 0
          fi
          QUESTION_B64="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" | head -c 2000 | base64 -w0)"
          test -n "$QUESTION_B64"
          echo "QUESTION_B64=$QUESTION_B64" >> "$GITHUB_ENV"
      - name: Build test
        run: gradle --no-daemon -p android_browser :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ask Google AI Mode via Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android_browser/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android_browser/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout -k 5s 125s adb shell am instrument -w -r -e q_b64 "$QUESTION_B64" -e class com.photofiver.phonebrowser.GoogleAskTest com.photofiver.phonebrowser.test/androidx.test.runner.AndroidJUnitRunner | tee google-ai-ask-instrumentation.txt
            grep -q 'OK (1 test)' google-ai-ask-instrumentation.txt
            adb pull /sdcard/Android/data/com.photofiver.phonebrowser/files/google-ai-ask-result.json google-ai-ask-result.json
            cat google-ai-ask-result.json
      - name: Upload Google AI answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-ai-ask-result
          path: |
            google-ai-ask-result.json
            google-ai-ask-instrumentation.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Post Google AI result to issue
        if: always()
        env:
          REVIEW_RUN_OK: ${{ job.status }}
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100});
            if(existing.data.some(c => c.user && c.user.login === 'github-actions[bot]')) {
              core.info('Already answered by warm Android session; do not post duplicate result.');
              return;
            }
            const fs=require('fs');
            let body='Google AI Mode did not return a readable result. See the workflow logs.';
            if(context.payload.issue.title.startsWith('[google-ask] [review]')){
              body='Google AI: NIEPOTWIERDZONE';
              if(process.env.REVIEW_RUN_OK === 'success'){
                const {execFileSync}=require('node:child_process');
                body='Google AI: '+execFileSync('python3',['phone_google_ask/review.py','result'],{encoding:'utf8'}).slice(0,-1);
              }
            } else if(fs.existsSync('google-ai-ask-result.json')){
              const result=JSON.parse(fs.readFileSync('google-ai-ask-result.json','utf8'));
              const p=result.page||{};
              body='Google AI Mode answer (unverified, may contain mistakes):\n\nQUESTION: '+result.question+
                '\n\nPAGE: '+(p.url||result.loadUrl)+
                '\n\nTEXT:\n'+(p.text||'NO TEXT')+
                '\n\nSOURCE LINKS: '+JSON.stringify(p.sourceLinks||[])+
                '\n\nAI RESPONSE READY: '+Boolean(result.aiResponseReady);
            }
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:body.slice(0,58000)});
