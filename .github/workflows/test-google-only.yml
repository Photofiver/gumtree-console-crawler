name: Test Google only on Android

on:
  push:
    paths:
      - 'phone_google_probe/**'
      - '.github/workflows/test-google-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Add single Google test and build Android APKs
        run: |
          cp phone_google_probe/GoogleOnlyTest.java android_browser/app/src/androidTest/java/com/photofiver/phonebrowser/GoogleOnlyTest.java
          gradle --no-daemon -p android_browser :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run just ONE Google search on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android_browser/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android_browser/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            set +e
            timeout -k 5s 80s adb shell am instrument -w -r -e class com.photofiver.phonebrowser.GoogleOnlyTest com.photofiver.phonebrowser.test/androidx.test.runner.AndroidJUnitRunner | tee google-test-instrumentation.txt
            echo "Google test completed; collecting saved Google result"
            set -e
            adb pull /sdcard/Android/data/com.photofiver.phonebrowser/files/google-only.json google-only.json || true
            adb logcat -d -s GOOGLE_SINGLE_PROBE:I '*:S' > google-test-logcat.txt || true
            if test -s google-only.json; then cat google-only.json; else echo "No Google report generated"; fi
      - name: Upload Google result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-one-search-result
          path: |
            google-only.json
            google-test-instrumentation.txt
            google-test-logcat.txt
          if-no-files-found: warn
          retention-days: 7
