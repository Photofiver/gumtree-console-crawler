name: Google AI receipt regression
on:
  pull_request:
    paths:
      - '.github/workflows/google-ai-ask.yml'
      - '.github/workflows/test-google-ai-receipts.yml'
      - 'phone_google_ask/warm_worker.py'
      - 'phone_google_ask/test_warm_worker.py'
      - 'phone_google_ask/google_ai_receipt_guard.js'
      - 'phone_google_ask/test_google_ai_receipt_guard.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test JavaScript workflow receipt guard
        run: node --test phone_google_ask/test_google_ai_receipt_guard.js
      - name: Test Python warm-worker receipt guard and existing behavior
        run: |
          PYTHONPATH=phone_google_ask python3 -m unittest discover -s phone_google_ask -p test_warm_worker.py -v
          python3 -m py_compile phone_google_ask/warm_worker.py
