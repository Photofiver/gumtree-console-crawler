name: Verify Blueprint private browser bridge

on:
  push:
    paths:
      - ".devcontainer/**"
      - "blueprint_bridge/**"
      - ".github/workflows/blueprint-bridge-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python code
        run: python -m py_compile blueprint_bridge/server.py
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r blueprint_bridge/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test Blueprint login detection
        run: python -m unittest discover -s blueprint_bridge -p 'test_*.py'
      - name: Launch temporary bridge and test private endpoints
        run: |
          set -euo pipefail
          python -m blueprint_bridge.server > /tmp/blueprint-bridge-check.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:8765/status > /tmp/bp-status.json; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Bridge process exited during startup"
              cat /tmp/blueprint-bridge-check.log
              exit 1
            fi
            sleep 2
          done
          test "$ready" = "1"
          python - <<'PY'
          import json, urllib.request
          status=json.load(open('/tmp/bp-status.json'))
          assert status['ready'] is True, status
          response=urllib.request.urlopen('http://127.0.0.1:8765/screen', timeout=15)
          screenshot=response.read()
          assert screenshot[:3]==b'\xff\xd8\xff', 'Expected JPEG screenshot'
          assert len(screenshot)>2000
          import json as _json
          for route,payload in [
              ('scroll', {'direction':'down'}),
              ('key', {'value':'Tab'}),
              ('home', {}),
          ]:
              req=urllib.request.Request('http://127.0.0.1:8765/'+route,
                  data=_json.dumps(payload).encode('utf-8'),
                  headers={'Content-Type':'application/json','Origin':'http://127.0.0.1:8765'},
                  method='POST')
              reply=urllib.request.urlopen(req, timeout=25)
              assert _json.load(reply)['ok'] is True, route
          response=urllib.request.urlopen('http://127.0.0.1:8765/')
          assert 'Blueprint' in response.read().decode('utf-8')
          print('Private browser bridge: HTTP status, screenshot and mobile UI passed')
          PY
          export BLUEPRINT_ACCESS_SHA256="$(python -c 'import hashlib; print(hashlib.sha256(("a"*64).encode()).hexdigest())')"
          python -m blueprint_bridge.live_gateway > /tmp/blueprint-gateway-check.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent http://127.0.0.1:8766/ > /dev/null; then break; fi
            sleep 1
          done
          python - <<'PY'
          import hashlib,urllib.request,urllib.error,json
          token='a'*64
          base='http://127.0.0.1:8766'
          try:
              urllib.request.urlopen(base+'/status', timeout=10)
              raise AssertionError('Unprotected session status endpoint')
          except urllib.error.HTTPError as exc:
              assert exc.code == 403
          req=urllib.request.Request(base+'/status',
              headers={'X-Bridge-Token':token})
          state=json.load(urllib.request.urlopen(req,timeout=15))
          assert state['ready']
          req=urllib.request.Request(base+'/key',
              data=json.dumps({'value':'Tab'}).encode(),
              headers={'X-Bridge-Token':token,
                       'Origin':base,
                       'Content-Type':'application/json'},method='POST')
          assert json.load(urllib.request.urlopen(req,timeout=20))['ok'] is True
          print('Gateway authentication and mobile POST control passed')
          PY
