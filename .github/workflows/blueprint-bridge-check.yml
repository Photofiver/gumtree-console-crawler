name: Verify Blueprint private browser bridge

on:
  push:
    paths:
      - ".devcontainer/**"
      - "blueprint_bridge/**"
      - ".github/workflows/blueprint-bridge-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python code
        run: python -m py_compile blueprint_bridge/server.py
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r blueprint_bridge/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Launch temporary bridge and test private endpoints
        run: |
          set -euo pipefail
          python -m blueprint_bridge.server > /tmp/blueprint-bridge-check.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:8765/status > /tmp/bp-status.json; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Bridge process exited during startup"
              cat /tmp/blueprint-bridge-check.log
              exit 1
            fi
            sleep 2
          done
          test "$ready" = "1"
          python - <<'PY'
          import json, urllib.request
          status=json.load(open('/tmp/bp-status.json'))
          assert status['ready'] is True, status
          response=urllib.request.urlopen('http://127.0.0.1:8765/screen', timeout=15)
          screenshot=response.read()
          assert screenshot[:3]==b'\xff\xd8\xff', 'Expected JPEG screenshot'
          assert len(screenshot)>2000
          response=urllib.request.urlopen('http://127.0.0.1:8765/')
          assert 'Blueprint' in response.read().decode('utf-8')
          print('Private browser bridge: HTTP status, screenshot and mobile UI passed')
          PY
