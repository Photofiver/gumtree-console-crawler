name: ChatGPT Work PR event bridge
on:
  # Each completed cold Google AI consultation triggers a new event.
  workflow_run:
    workflows: ["Google AI Mode ask (isolated)"]
    types: [completed]
  # Warm Google AI receipts and auto-research lead updates dispatch immediately.
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Authenticated consult or auto-research issue number"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: chatgpt-work-pr-bridge
  cancel-in-progress: false

jobs:
  emit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'issues' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send new evidence to existing pull-request comment channel
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const owner = context.repo.owner, repo = context.repo.repo;
            const BRIDGE_PR = 283;
            const eventRun = context.payload.workflow_run;
            const match = /Google AI issue #([0-9]+)/.exec(eventRun?.display_title || '');
            const number = Number(context.payload.inputs?.issue_number || match?.[1] || 0);
            if (!Number.isSafeInteger(number) || number < 1) {
              core.info('No associated research issue; skip.');
              return;
            }
            const {data: issue} = await github.rest.issues.get({
              owner, repo, issue_number: number
            });
            if (issue.user?.login !== owner ||
                !/^\[(?:consult|auto-research)\]/.test(issue.title || '')) {
              core.info('Issue not an authorized research task; skip.');
              return;
            }
            const {data: pull} = await github.rest.pulls.get({
              owner, repo, pull_number: BRIDGE_PR
            });
            if (pull.state !== 'open') {
              core.warning('Bridge PR closed; no trigger can be emitted.');
              return;
            }

            const issueComments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number: number, per_page: 100}
            );
            const trusted = issueComments.filter(c =>
              c.user?.login === 'github-actions[bot]'
            ).reverse();
            const expectedHash = crypto.createHash('sha256')
              .update(issue.body || '', 'utf8').digest('hex');
            let body, stateId;
            if (issue.title.startsWith('[consult]')) {
              let receipt = null;
              for (const c of trusted) {
                if (!(c.body || '').startsWith('Konsultant/2 ')) continue;
                try {
                  const parsed = JSON.parse(c.body.slice('Konsultant/2 '.length));
                  if (parsed.issue === number && parsed.sha256 === expectedHash &&
                      (parsed.google_ai_responses_received || 0) > 0) {
                    receipt = parsed;
                    stateId = 'google-' + c.id;
                    break;
                  }
                } catch (e) { core.info('Malformed receipt ignored'); }
              }
              if (!receipt) {
                core.info('No authenticated Google AI verdict for #' + number + '.');
                return;
              }
              body = [
                'GitHub/Google-AI audit ready for independent CHATGPT verification.',
                'Issue: ' + issue.html_url,
                'Google AI review: ' + (receipt.review || 'unknown'),
                'Evidence state: ' + (receipt.status || 'unknown'),
                'Unresolved: ' + JSON.stringify((receipt.blocked || []).slice(0, 15)),
                'Next: ChatGPT must independently inspect primary sources, correct the',
                'full draft when needed, and submit a NEW [consult] issue for Google AI',
                'with parent_issue=' + number + '; do not claim a completed solution',
                'solely from Google AI feedback or this bridge event.'
              ].join('\n');
            } else {
              let snapshot = null;
              for (const c of trusted) {
                if (!(c.body || '').startsWith('AutoResearch/1 ')) continue;
                try {
                  const parsed = JSON.parse(c.body.slice('AutoResearch/1 '.length));
                  if (parsed.issue === number && parsed.sha256 === expectedHash &&
                      (parsed.sources || []).length > 0) {
                    snapshot = parsed;
                    stateId = 'leads-' + c.id + '-' +
                      parsed.rounds + '-' + parsed.sources.length;
                    break;
                  }
                } catch (e) { core.info('Malformed research snapshot ignored'); }
              }
              if (!snapshot) {
                core.info('No independently opened source leads yet.');
                return;
              }
              const sources = snapshot.sources.slice(-5).map(x => x.url);
              body = [
                'GitHub research agent found source leads for CHATGPT to verify.',
                'Issue: ' + issue.html_url,
                'Research rounds: ' + snapshot.rounds,
                'Source leads (NOT independently ChatGPT-verified):',
                ...sources,
                'Next: ChatGPT must open the sources itself, check all hard constraints,',
                'produce a new draft and send a [consult] for independent Google AI review.',
                'Never treat leads or drafts as a finished validated kit.'
              ].join('\n');
            }
            const marker = '<!-- chatgpt-work-event:' + number + ':' +
              crypto.createHash('sha256').update(stateId).digest('hex').slice(0, 20) + ' -->';
            const existing = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number: BRIDGE_PR, per_page: 100}
            );
            if (existing.some(c => (c.body || '').includes(marker))) {
              core.info('Event already delivered to bridge PR; skip duplicate.');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: BRIDGE_PR, body: marker + '\n' + body
            });
            core.info('Published GitHub PR comment event for issue #' + number +
              ' (ChatGPT Work must be separately configured to receive it).');
