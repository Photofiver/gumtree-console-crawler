name: TikTok + GitHub AI generator every 4 hours (direct API)
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tiktok-autobot-four-hourly.yml'
permissions:
  contents: write
concurrency:
  group: photofiver-tiktok-ai-autoposter
  cancel-in-progress: false
jobs:
  ai-video:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate isolated Python scripts
        run: python3 -m py_compile autopost_tiktok/generate.py autopost_tiktok/direct_preflight.py
      - name: Verify TikTok publishing OAuth directly without uploading
        id: auth
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OAUTH_ACCESS_TOKEN: ${{ secrets.TIKTOK_OAUTH_ACCESS_TOKEN }}
          TIKTOK_API_ACCESS_TOKEN: ${{ secrets.TIKTOK_API_ACCESS_TOKEN }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
        run: python3 autopost_tiktok/direct_preflight.py
      - name: Check whether video already generated in 4-hour slot
        id: slot
        if: steps.auth.outputs.authorized == 'true'
        shell: bash
        run: |
          h=$(date -u +%-H)
          day=$(date -u +%Y%m%d)
          slot=$(printf '%02d' "$((h / 4 * 4))")
          path="social_videos/ai-cat-${day}-${slot}.mp4"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          if test -e "$path"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install tools for original AI video and Polish speech quality check
        if: github.event_name != 'push' && steps.auth.outputs.authorized == 'true' && steps.slot.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade gradio_client faster-whisper
      - name: Generate one original video and verify spoken Polish
        if: github.event_name != 'push' && steps.auth.outputs.authorized == 'true' && steps.slot.outputs.exists == 'false'
        run: timeout 490s python3 autopost_tiktok/generate.py
      - name: Save verified MP4 and consent-pending metadata to GitHub
        if: github.event_name != 'push' && steps.auth.outputs.authorized == 'true' && steps.slot.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.slot.outputs.path }}"
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          data=json.loads(Path("autopost_tiktok/last-generation-report.json").read_text())
          assert data["generated"] and data["speech_verified"], "Not verified"
          mp4=Path(data["file"])
          digest=hashlib.sha256(mp4.read_bytes()).hexdigest()
          record={"account":"@photofiver.photof","video_path":str(mp4),
                  "caption":data["caption_line"]+" #kot #AI #polskitiktok",
                  "sha256":digest,"status":"awaiting_preview_and_explicit_consent",
                  "note":"TikTok Direct Post requires individual explicit consent and app approval"}
          path=Path("autopost_tiktok/pending")/(mp4.stem+".json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(record,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.slot.outputs.path }}" autopost_tiktok/pending/
          git commit -m "Stage verified AI video for TikTok creator's approval"
          git push origin HEAD:main
      - name: Explain TikTok platform authorization and consent gate
        if: always()
        shell: bash
        run: |
          echo 'GitHub is connected directly to TikTok API only when its OAuth credentials are present.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unattended publication without creator review and express consent is not permitted by TikTok Direct Post API.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No video was posted automatically. No Buffer API was used.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve direct TikTok permission and generation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-github-direct-${{ github.run_id }}
          path: |
            autopost_tiktok/preflight-status.json
            autopost_tiktok/last-generation-report.json
          if-no-files-found: warn
          retention-days: 7
