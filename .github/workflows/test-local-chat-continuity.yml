name: Test ordinary-chat continuity bridge
on:
  pull_request:
    paths:
      - 'plugins/google-ai-konsultant/local_chat_continuity.py'
      - 'plugins/google-ai-konsultant/test_local_chat_continuity.py'
      - '.github/workflows/test-local-chat-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python3 -m py_compile plugins/google-ai-konsultant/local_chat_continuity.py
      - name: Test safe transport and state
        run: python3 -m unittest discover -s plugins/google-ai-konsultant -p 'test_local_chat_continuity.py' -v
