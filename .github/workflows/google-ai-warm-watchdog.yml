name: Google AI warm session watchdog
on:
  schedule:
    # A new session is queued before the 315-minute worker expires; GitHub
    # schedules can be delayed, so do not rely on one exact start time.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

# Only one persistent emulator; keep one replacement queued, rather than
# starting a new Android instance for every question.
concurrency:
  group: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, '[google-warm-test]') && 'google-ai-warm-oneoff-test' || 'google-ai-warm-persistent' }}
  cancel-in-progress: false

jobs:
  warm-session:
    if: ${{ github.event_name != 'issues' || ((startsWith(github.event.issue.title, '[google-warm-test]') || startsWith(github.event.issue.title, '[google-warm-start]')) && github.event.issue.user.login == github.repository_owner) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate worker Python files
        run: python3 -m py_compile phone_google_ask/warm_worker.py phone_google_ask/review.py
      - name: Prepare optional trained Attention once per warm session
        run: |
          if ! python3 -m pip install --user --disable-pip-version-check 'sentence-transformers==4.1.0'; then
            echo "Attention unavailable; Google AI transport will still run."
          fi
      - name: Prepare persistent Android worker
        run: cp phone_google_ask/GoogleAskTest.java android_browser/app/src/androidTest/java/com/photofiver/phonebrowser/GoogleAskTest.java
      - name: Build Android app once per warm session
        run: gradle --no-daemon -p android_browser :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keep emulator warm and serve issue queue
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WARM_RUNTIME_MINUTES: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, '[google-warm-test]') && '4' || '315' }}
          WARM_TEST_ISSUE: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, '[google-warm-test]') && github.event.issue.number || '0' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android_browser/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android_browser/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python3 phone_google_ask/warm_worker.py --runtime-minutes "$WARM_RUNTIME_MINUTES" --test-issue "$WARM_TEST_ISSUE"
