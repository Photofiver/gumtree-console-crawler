name: Publish corrected photorealistic speaking cat MP4
on:
  push:
    paths:
      - '.github/workflows/publish-realistic-speaking-cat.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch tested realistic cat with native AI speech
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p social_videos /tmp/cat_native
          gh run download 43794593062 --repo ${{ github.repository }} --name photorealistic-cat-speaking-test --dir /tmp/cat_native
          test -s /tmp/cat_native/realistic-cat-speaking-native-ai.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/cat_native/realistic-cat-speaking-report.json').read_text())
          assert j['success'] and j['speech_verified'],j
          assert j['dialogue_similarity']>.85
          print("Verified real moving cat with AI Polish speech",j['detected_transcript'])
          PY
          cp /tmp/cat_native/realistic-cat-speaking-native-ai.mp4 social_videos/photorealistic-talking-cat-ai.mp4
      - name: Publish direct-download MP4
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social_videos/photorealistic-talking-cat-ai.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish photorealistic original AI cat with Polish voice"
          git push origin HEAD:main
