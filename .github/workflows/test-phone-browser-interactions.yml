name: Test Android browser interactions
on:
  push:
    paths:
      - 'phone_interaction_probe/**'
      - '.github/workflows/test-phone-browser-interactions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interaction-check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile one isolated browser interaction test
        run: |
          cp phone_interaction_probe/BrowserInteractionTest.java android_browser/app/src/androidTest/java/com/photofiver/phonebrowser/BrowserInteractionTest.java
          gradle --no-daemon -p android_browser :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test touchscreen, form and browser navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android_browser/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android_browser/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout -k 5s 65s adb shell am instrument -w -r -e class com.photofiver.phonebrowser.BrowserInteractionTest com.photofiver.phonebrowser.test/androidx.test.runner.AndroidJUnitRunner > browser-interaction-test.log
            adb pull /sdcard/Android/data/com.photofiver.phonebrowser/files/browser-interaction.json browser-interaction.json || true
            cat browser-interaction-test.log
            if test -s browser-interaction.json; then cat browser-interaction.json; fi
            grep -q 'OK (1 test)' browser-interaction-test.log
      - name: Save interaction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-browser-interaction-report
          path: |
            browser-interaction.json
            browser-interaction-test.log
          if-no-files-found: warn
          retention-days: 7
