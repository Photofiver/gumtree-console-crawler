name: Google AI original generative video solution
on:
  push:
    paths:
      - 'social_probe/OrigVideoGoogleSolutionTest.java'
      - '.github/workflows/original-ai-video-google-solution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brainstorm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build standalone Google AI brainstorm test
        run: |
          cp social_probe/OrigVideoGoogleSolutionTest.java android_browser/app/src/androidTest/java/com/photofiver/phonebrowser/OrigVideoGoogleSolutionTest.java
          gradle --no-daemon -p android_browser :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ask Google AI for implementable free social media options
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r android_browser/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android_browser/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout -k 5s 125s adb shell am instrument -w -r -e class com.photofiver.phonebrowser.OrigVideoGoogleSolutionTest com.photofiver.phonebrowser.test/androidx.test.runner.AndroidJUnitRunner | tee brainstorm-instrumentation.txt
            grep -q 'OK (1 test)' brainstorm-instrumentation.txt
            adb pull /sdcard/Android/data/com.photofiver.phonebrowser/files/original-ai-video-google-response.json original-ai-video-google-response.json
            cat original-ai-video-google-response.json
      - name: Upload answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-original-video-solution
          path: |
            original-ai-video-google-response.json
            brainstorm-instrumentation.txt
          if-no-files-found: warn
          retention-days: 7
