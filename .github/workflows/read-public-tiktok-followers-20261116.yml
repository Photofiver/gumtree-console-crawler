name: Check public follower count of photofiver.photof (read-only, no token)
on:
  push:
    paths:
      - '.github/workflows/read-public-tiktok-followers-20261116.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only public TikTok profile data (no login and no API writes)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,re,html
          handle="photofiver.photof"
          urls=["https://www.tiktok.com/@" + handle + "?lang=en",
                "https://www.tiktok.com/@" + handle]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={
                 "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
                 "Accept-Language":"en-GB,en;q=0.9",
                 "Accept":"text/html,application/xhtml+xml"})
              with urllib.request.urlopen(req, timeout=16) as res:
                page=res.read(2500000).decode("utf-8","replace")
                print("PUBLIC_FETCH",res.status,len(page),"final_url",res.url.split("?")[0])
              if len(page)<5000: continue
              for name in ("SIGI_STATE","__UNIVERSAL_DATA_FOR_REHYDRATION__"):
                m=re.search(r'<script[^>]*id=["\']'+re.escape(name)+r'["\'][^>]*>(.*?)</script>',page,re.S)
                if not m: continue
                tree=json.loads(html.unescape(m.group(1)))
                def walk(data):
                  if isinstance(data,dict):
                    if data.get("uniqueId","").lower()==handle and "stats" in data:
                      stats=data.get("stats",{})
                      if isinstance(stats,dict) and "followerCount" in stats:
                        return stats["followerCount"]
                    if data.get("uniqueId","").lower()==handle and "followerCount" in data:
                      return data["followerCount"]
                    if "userInfo" in data and isinstance(data["userInfo"],dict):
                      user=data["userInfo"].get("user",{})
                      stats=data["userInfo"].get("stats",{})
                      if user.get("uniqueId","").lower()==handle and "followerCount" in stats:
                        return stats["followerCount"]
                    for v in data.values():
                      x=walk(v)
                      if x is not None:return x
                  elif isinstance(data,list):
                    for v in data:
                      x=walk(v)
                      if x is not None:return x
                  return None
                n=walk(tree)
                if isinstance(n,int) and n>=0:
                  print("VERIFIED_TIKTOK_FOLLOWER_COUNT",handle,n)
                  raise SystemExit(0)
              m=re.search(r'"uniqueId"\s*:\s*"'+re.escape(handle)+r'".{0,2500}?"followerCount"\s*:\s*(\d+)',page,re.S)
              if m:
                print("POSSIBLE_TIKTOK_FOLLOWER_COUNT",handle,int(m.group(1)))
                raise SystemExit(0)
              print("PUBLIC_PROFILE_NO_FOLLOWER_DATA")
            except (urllib.error.URLError,TimeoutError,ValueError) as exc:
              print("PUBLIC_FETCH_UNAVAILABLE",type(exc).__name__,str(exc)[:140])
          print("FOLLOWER_COUNT_UNAVAILABLE: TikTok denies public data without proper stat authorization")
          PY
