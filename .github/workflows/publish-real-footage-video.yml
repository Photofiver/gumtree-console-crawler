name: Publish real footage social video as one-click MP4
on:
  push:
    paths:
      - '.github/workflows/publish-real-footage-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-video:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve verified video artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p social_videos /tmp/testvideo
          gh run download 43790157710 --repo ${{ github.repository }} --name real-footage-short --dir /tmp/testvideo
          file /tmp/testvideo/social-real-footage-short.mp4
          test -s /tmp/testvideo/social-real-footage-short.mp4
          cp /tmp/testvideo/social-real-footage-short.mp4 social_videos/real-footage-short.mp4
          cp /tmp/testvideo/social-real-footage-credits.json social_videos/real-footage-short-credits.json
      - name: Commit the MP4 without affecting other files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social_videos/real-footage-short.mp4 social_videos/real-footage-short-credits.json
          if git diff --cached --quiet; then echo "Video already published"; exit 0; fi
          git commit -m "Publish real moving footage short MP4 and CC license attribution"
          git push origin HEAD:main
