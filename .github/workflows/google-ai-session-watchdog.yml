name: Google AI session watchdog (self-healing)
on:
  schedule:
    # Check at offset minutes to avoid GitHub's busiest minute.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  revive:
    if: ${{ github.event_name != 'issues' || (startsWith(github.event.issue.title, '[google-warm-restart]') && github.event.issue.user.login == github.repository_owner) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restart warm Google AI worker if no session is running or queued
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'google-ai-warm-watchdog.yml';
            if (context.eventName === 'issues') {
              const {data: runs} = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, status: 'in_progress', per_page: 30
              });
              for (const run of runs.workflow_runs) {
                if (run.event === 'schedule' || run.event === 'workflow_dispatch' ||
                    (run.event === 'issues' && run.display_title?.startsWith('[google-warm-start]'))) {
                  await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                  core.info('Stopped old warm session ' + run.id);
                }
              }
              const {data: repository} = await github.rest.repos.get({owner, repo});
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: repository.default_branch
              });
              core.info('Started new warm session after owner restart request');
              return;
            }
            const statuses = ['in_progress', 'queued', 'waiting', 'requested', 'pending'];
            let alive = false;
            for (const status of statuses) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, status, per_page: 20
              });
              const active = data.workflow_runs.filter(run =>
                run.event === 'schedule' || run.event === 'workflow_dispatch' || (run.event === 'issues' && run.display_title?.startsWith('[google-warm-start]'))
              );
              if (active.length > 0) {
                alive = true;
                core.info('Warm session already active or scheduled: ' + active[0].html_url);
                break;
              }
            }
            if (!alive) {
              const { data: repository } = await github.rest.repos.get({owner, repo});
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id,
                ref: repository.default_branch
              });
              core.info('Warm session restarted by watchdog');
            }
