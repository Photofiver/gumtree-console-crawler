<!doctype html><html lang="pl"><meta charset="utf-8"><title>Consult bridge</title><body><p id="status">Bridge not started</p><button id="start">Monitor GitHub</button><button id="stop">Stop</button><script type="module">
let timer, lastId=0, issue=293, seq=0;
const pending=new Map(),status=document.querySelector('#status');
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;const id=e.data.id;if(pending.has(id)){pending.get(id)(e.data);pending.delete(id)}});
function rpc(method,params){const id=++seq;return new Promise((resolve,reject)=>{const t=setTimeout(()=>{pending.delete(id);reject(Error('Host timeout'))},10000);pending.set(id,msg=>{clearTimeout(t);msg.error?reject(Error(msg.error.message)):resolve(msg.result)});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
async function poll(){const r=await fetch('https://api.github.com/repos/Photofiver/gumtree-console-crawler/issues/'+issue+'/comments?per_page=100',{cache:'no-store'});if(!r.ok)throw Error('GitHub HTTP '+r.status);const data=await r.json();if(!lastId){lastId=data.at(-1)?.id||0;return}for(const c of data.filter(x=>x.id>lastId&&x.user?.login==='github-actions[bot]'&&x.body?.startsWith('Konsultant/2 '))){await rpc('ui/message',{role:'user',content:[{type:'text',text:'Review Google AI receipt in GitHub issue #'+issue+' comment '+c.id+'; continue the consultation only if supported.'}],_meta:{'openai/message':{target:'active',send:true}}});lastId=c.id;status.textContent='Sent '+c.id}}
}
document.querySelector('#start').onclick=async()=>{if(timer)return;try{const init=await rpc('ui/initialize',{appInfo:{name:'consult-handoff',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');if(!init?.hostCapabilities?.message)throw Error('ui/message unavailable');await poll();timer=setInterval(()=>poll().catch(e=>status.textContent=e.message),30000);status.textContent='Monitoring active ChatGPT app'}catch(e){status.textContent='Unavailable: '+e.message}};
document.querySelector('#stop').onclick=()=>{clearInterval(timer);timer=null;status.textContent='Stopped'};
</script></body></html>
